services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - vyrex_data:/app/data
    networks:
      - internal
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - internal
volumes:
  vyrex_data:
  caddy_data:
  caddy_config:
networks:
  internal:
